apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: web-deployment 
  labels: 
    app: web 
spec: 
  replicas: 3 
  selector: 
    matchLabels: 
      app: web 
  strategy: 
    type: RollingUpdate 
    rollingUpdate: 
      maxSurge: 1 
      maxUnavailable: 0 
  template: 
    metadata: 
      labels: 
        app: web 
    spec: 
      containers: 
        - name: nginx 
          image: nginx:1.25 
          ports: 
            - containerPort: 80 
          readinessProbe: 
            httpGet: 
              path: / 
              port: 80 
            initialDelaySeconds: 3 
            periodSeconds: 5 
